    <div class="sidebar-footer">

            <button class="faye-clear" type="button" id="fayeClear">ล้างแชท</button>
          </div>
          <!-- The conversation: kept until the page is reloaded or closed -->
          <div class="faye-log" id="fayeLog" role="log" aria-live="polite" aria-label="แชทกับ Faye"></div>
          <div class="faye-suggest" id="fayeSuggest" aria-label="คำถามแนะนำ"></div>
          <form class="faye-find faye-ask" id="fayeAsk">
            <input type="text" id="fayeAskInput" placeholder="พิมพ์ถาม Faye…" aria-label="พิมพ์ถาม Faye" autocomplete="off" maxlength="300" enterkeyhint="send">
            <button class="btn btn-primary btn-sm" type="submit">ส่ง</button>
          </form>
          <!-- Menu: folded away so the chat has room; opens with a tap -->
          <details class="faye-menu" id="fayeMenu">
            <summary><span class="faye-ico">☰</span><span class="faye-menu-t">เมนู</span><span class="faye-where" id="fayeWhere"></span><span class="faye-count" id="fayeMenuCount" hidden></span></summary>
            <div class="faye-menu-body">
          <button class="faye-menu-item faye-back" type="button" id="fayeBack" hidden><span class="faye-ico">‹</span><span class="faye-lbl">กลับเมนูหลัก</span></button>

          <div class="faye-view" data-view="main">
            <button class="faye-menu-item" type="button" data-open="news"><span class="faye-ico">🔔</span><span class="faye-lbl">มีอะไรใหม่</span><span class="faye-count" id="fayeNewsCount" hidden></span><span class="faye-chev">›</span></button>

            <button class="faye-menu-item" type="button" data-open="go"><span class="faye-ico">🧭</span><span class="faye-lbl">ไปหน้าอื่น</span><span class="faye-chev">›</span></button>
            <button class="faye-menu-item" type="button" data-open="tips"><span class="faye-ico">💡</span><span class="faye-lbl">ถามเรื่องหน้านี้</span><span class="faye-chev">›</span></button>

          <div class="faye-view" data-view="settings" hidden>
            <button class="faye-menu-item" type="button" id="fayeMini"><span class="faye-ico">🔎</span><span class="faye-lbl">ย่อ Faye</span></button>
